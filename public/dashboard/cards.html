<body onload="listarPerformance()" style="background-color: rgb(211, 143, 16);">

    <div class="janela">

        <div class="header-left dash-header">
            <a href="../index.html">
                <img src="../assets/imgs/BasketicLogo.png" class="titulo" />
            </a>




            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>! Jogou hoje?</h3>
            </div>

            <div class="btn-nav">
                <h3>Basketic</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Dashboard</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>
        <div class="dash">
            <div class="perguntas">
                <div class="horas_jogadas">
                    <label>Quantas horas você jogou hoje?</label>
                    <input type="text" id="ipt_horario_incio" placeholder="Ex: 10">
                </div>
                <div class="qtd_cestas">
                    <label>Quantas cestas você fez hoje?</label>
                    <input type="text" id="ipt_qtd_cestas" placeholder="Ex: 27">
                </div>
                <div class="qtd_partidas">
                    <label>Quantas partidas você jogou hoje?</label>
                    <input type="text" id="ipt_qtd_partidas" placeholder="Ex: 13">
                </div>
                <div class="qtd_vitorias">
                    <label>Quantas vitórias você conseguiu ter hoje? </label>
                    <input type="text" id="ipt_qtd_vitorias" placeholder="Ex: 13">
                    <button onclick="cadastrar(), window.location.reload()" class="btn-logout">Cadastrar</button>
                </div>
            </div>

            <div class="fundo-antes-grafico">


                <div class="grafico-performance">
                    <div class="left-info">
                        <canvas id="grafico-cestapartida-ultimo-jogo"></canvas>
                    </div>

                    <div class="right-info">
                        <canvas id="grafico-performance-ultimo-jogo"></canvas>
                    </div>
                </div>
            </div>
            <div class="area-kpi">
                <div class="kpi">
                    <p>Sua performance de agora foi <span id="kpi_texto" style="color: rgb(255, 145, 0);"></span>, que o
                        último jogo</p>
                </div>
            </div>
        </div>
    </div>





</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    function monitorarMelhoria(novo_jogo, antigo_jogo) {
        var evolucao = ((novo_jogo - antigo_jogo) / antigo_jogo) * 100

        if (evolucao.toFixed(2) == 0) {
            kpi_texto.innerHTML = `<span style="color: rgb(255, 145, 0);">a mesma</span>`
        }
        else if (evolucao > 0) {
            kpi_texto.innerHTML = `<span style="color: rgb(0, 255, 0);">${Math.abs(evolucao).toFixed(2)}% melhor</span>`
        }
        else {
            kpi_texto.innerHTML = `<span style="color: rgb(255, 0, 0);">${Math.abs(evolucao).toFixed(2)}% pior</span>`
        }

        return kpi_texto.innerHTML
    }

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function cadastrar() {
        // aguardar();

        //Recupere o valor da nova input pelo nome do id
        // Agora vá para o método fetch logo abaixo
        var horas_jogadas = ipt_horario_incio.value
        var fk_usuario = sessionStorage.ID_USUARIO
        var qtd_cestas = ipt_qtd_cestas.value
        var qtd_partidas = ipt_qtd_partidas.value
        var qtd_vitorias = ipt_qtd_vitorias.value


        // Verificando se há algum campo em branco

        let encontrou_arroba_ou_ponto = false

        // for (let i = 0; i < emailVar.length; i++) {
        //     if (emailVar[i] == "@" || emailVar[i] == ".") {
        //         encontrou_arroba_ou_ponto = true
        //     }
        // }

        // if (!encontrou_arroba_ou_ponto) {
        //     alert("Email inválido")
        //     finalizarAguardar()
        //     return false
        // }

        if (
            horas_jogadas == ""
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(Mensagem de erro para todos os campos em branco)";

            // finalizarAguardar();
            return false;

        }
        fetch("/dados/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                horasServer: horas_jogadas,
                fkUsuarioServer: fk_usuario,
                cestasServer: qtd_cestas,
                partidasServer: qtd_partidas,
                vitoriasServer: qtd_vitorias
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    // cardErro.style.display = "block";

                    // mensagem_erro.innerHTML =
                    //     "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    // setTimeout(() => {
                    //     window.location = "login.html";
                    // }, "2000");

                    // limparFormulario();
                    // finalizarAguardar();
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                // finalizarAguardar();
            });

        listarPerformance()
        return false;
    }

    function listarPerformance() {

        var fk_usuario = sessionStorage.ID_USUARIO;

        fetch(`/dados/performance/${fk_usuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    plotarPerformance(resposta)
                    resposta.reverse();

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Se não houver dados, mostra gráficos zerados
                plotarPerformance([]);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                // Se houver erro, mostra gráficos zerados
                plotarPerformance([]);
            });
    }

    function taxaPerformance(cesta, partida) {
        var performance = cesta / partida
        return performance.toFixed(2)
    }

    function plotarPerformance(resposta) {

        let qtd_cestas_peunultimo_jogo = 0
        let qtd_partidas_penultimo = 0
        let qtd_cestas_ultimo_jogo = 0
        let qtd_partidas_ultimo = 0

        // Verifica se há dados disponíveis
        if (resposta && resposta.length >= 1) {
            qtd_cestas_ultimo_jogo = resposta[0].qtd_cestas
            qtd_partidas_ultimo = resposta[0].qtd_partidas
        }

        if (resposta && resposta.length >= 2) {
            qtd_cestas_peunultimo_jogo = resposta[1].qtd_cestas
            qtd_partidas_penultimo = resposta[1].qtd_partidas
        }


        const ctx = document.getElementById('grafico-cestapartida-ultimo-jogo');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Penúltimo jogo', 'Último jogo'],
                datasets: [
                    {
                        label: 'Cestas',
                        data: [qtd_cestas_peunultimo_jogo, qtd_cestas_ultimo_jogo],
                        backgroundColor: '#F39237',
                        borderWidth: 0
                    },
                    {
                        label: 'Partidas Jogadas',
                        data: [qtd_partidas_penultimo, qtd_partidas_ultimo],
                        backgroundColor: '#D97435',
                        borderWidth: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Quantidade de cestas e partidas jogadas nos últimos jogos',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    },
                    legend: {
                        display: true,
                        position: 'top'
                    },
                    filler: {
                        propagate: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });


        let performance_ultimo = taxaPerformance(qtd_cestas_ultimo_jogo, qtd_partidas_ultimo)
        let performance_penultimo = taxaPerformance(qtd_cestas_peunultimo_jogo, qtd_partidas_penultimo)

        monitorarMelhoria(performance_ultimo, performance_penultimo)

        console.log(performance_penultimo, performance_ultimo)

        const ctx2 = document.getElementById('grafico-performance-ultimo-jogo');

        new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: ['Penúltimo jogo', 'Último jogo'],
                datasets: [{
                    label: 'Performance',
                    data: [performance_penultimo, performance_ultimo],
                    borderWidth: 1,
                    backgroundColor: '#F39237'
                },]

            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Performance',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    },
                    legend: {
                        display: true,
                        position: 'top'
                    },
                    filler: {
                        propagate: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });


    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página e,
    // A função *plotarGrafico* também invoca a função *atualizarGrafico*



</script>

</html>
