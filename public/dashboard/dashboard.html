<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let proximaAtualizacao;

    let primeiro_jogo = 1
    let segundo_jogo = 2
    let terceiro_jogo = 3
    let quarto_jogo = 4
    let quinto_jogo = 5
    let sexto_jogo = 6
    let setimo_jogo = 7

    const meu_grafico = document.getElementById('grafico_geral');

    new Chart(
        meu_grafico, {
        // type serve para definir o tipo do gráfico
        type: 'bar',
        data: {
            // data: serve para colocar as informações do gráfico
            // esse label serve para legendar cada barra do gráfico
            labels: [
                'Primeiro jogo', 'Segundo jogo', 'Terceiro jogo', 'Quarto jogo', 'Quinto jogo', 'Sexto jogo', 'Sétimo jogo'
            ],

            // datasets serve para realmente colocar os valores do gráfico conforme a ordem
            datasets: [
                {
                    label: 'Performance',
                    data: [primeiro_jogo, segundo_jogo, terceiro_jogo, quarto_jogo, quinto_jogo, sexto_jogo, setimo_jogo],
                    borderWidth: 1,
                    backgroundColor: '#F39237'
                }
            ]
        },
        // configura as posições do gráfico
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Desempenho nos últimos 7 jogos',
                    font: {
                        size: 16,
                        weight: 'bold'
                    }
                },
                legend: {
                    display: true,
                    position: 'top',
                },
                filler: {
                    propagate: true
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                },
                x: {
                        grid: {
                            display: false
                        }
                    }
            }
        }
    }
    )


</script>
