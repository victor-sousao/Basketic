<body onload="listarPerformance()">

    <div class="header-left">
        <a href="../index.html">
            <img src="../assets/imgs/BasketicLogo.png" class="titulo" />
        </a>

        <div class="hello">
            <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
        </div>

        <div class="btn-nav-white">
            <a href="./cards.html">
                <h3>Basketic</h3>
            </a>
        </div>


        <div class="btn-nav">
            <h3>Dashboard</h3>
        </div>

        <div class="btn-logout" onclick="limparSessao()">

    <div class="janela">
        <div class="dash">
            <div class="dash-container">
                <div class="grafico-performance">
                    <canvas id="grafico_geral">

                    </canvas>

                </div>
            </div>
        </div>
        <div class="area-kpi">
            <div class="kpi">
                <p>Sua melhor jogatina foi no, <span id="kpi_texto" style="color: rgb(4, 109, 4);"></span></p>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function melhorJogo(lista) {

        var posicoes = ['Primeiro jogo', 'Segundo jogo', 'Terceiro jogo', 'Quarto jogo', 'Quinto jogo', 'Sexto jogo', 'Sétimo jogo']
        var numeros = lista.map(Number)
        var melhorJogatina = Math.max(...numeros);
        var indice = numeros.indexOf(melhorJogatina)

        console.log(melhorJogatina)
        console.log(indice)

        kpi_texto.innerHTML = `${posicoes[indice]} com uma performance de ${melhorJogatina} pontos`

        return kpi_texto.innerHTML
    }

    function listarPerformance() {

        var fk_usuario = sessionStorage.ID_USUARIO;

        fetch(`/dados/performance/${fk_usuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    plotarPerformance(resposta)
                    resposta.reverse();

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Se não houver dados, mostra gráficos zerados
                plotarPerformance([]);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                // Se houver erro, mostra gráficos zerados
                plotarPerformance([]);
            });
    }

    function taxaPerformance(cesta, partida) {
        var performance = cesta / partida
        return performance.toFixed(2)
    }

    function plotarPerformance(resposta) {

        let lista = []

        console.log(resposta)

        for (let i = 0; i < resposta.length; i++) {
            var performance_dia = taxaPerformance(
                resposta[i].qtd_cestas,
                resposta[i].qtd_partidas
            )

            lista.push(performance_dia)

        }

        melhorJogo(lista)

        console.log(lista)





        // // Verifica se há dados disponíveis
        // if (resposta && resposta.length >= 1) {
        //     qtd_cestas_ultimo_jogo = resposta[0].qtd_cestas
        //     qtd_partidas_ultimo = resposta[0].qtd_partidas
        // }

        // if (resposta && resposta.length >= 2) {
        //     qtd_cestas_peunultimo_jogo = resposta[1].qtd_cestas
        //     qtd_partidas_penultimo = resposta[1].qtd_partidas
        // }

        const meu_grafico = document.getElementById('grafico_geral');

        new Chart(
            meu_grafico, {
            // type serve para definir o tipo do gráfico
            type: 'bar',
            data: {
                // data: serve para colocar as informações do gráfico
                // esse label serve para legendar cada barra do gráfico
                labels: [
                    'Primeiro jogo', 'Segundo jogo', 'Terceiro jogo', 'Quarto jogo', 'Quinto jogo', 'Sexto jogo', 'Sétimo jogo'
                ],

                // datasets serve para realmente colocar os valores do gráfico conforme a ordem
                datasets: [
                    {
                        label: 'Performance',
                        data: lista,
                        borderWidth: 1,
                        backgroundColor: '#F39237'
                    }
                ]
            },
            // configura as posições do gráfico
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Desempenho nos últimos 7 jogos',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    },
                    legend: {
                        display: true,
                        position: 'top',
                    },
                    filler: {
                        propagate: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        }
        )
    }

</script>
